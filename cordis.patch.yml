# dsh-session-handoff — session handoff & context management.
#
# Host plugin: registers handoff_* tools (structured session handoff),
# acp_* tools (active context pruning via the official compaction API),
# and soft-detects OpenViking / archify for optional memory + diagram
# enhancement. No client bundle in v0.1 (agent-driven workflow).
- insert:
    - id: session-handoff
      name: 'dsh-session-handoff'

# Web profiles disable compaction-basic on the host plane (dsh-web-app moves
# it into per-session preset realms), so sessions created before the preset
# mechanism — or any session without a realm — never get a compaction
# backend and acp_compress always fails. Re-enable the row here: this patch
# applies after dsh-web-app's and the loader's last-write-wins per row id
# restores the host-plane backend for every session. Per-session realms keep
# their own backend; host visibility is the fallback.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: false
